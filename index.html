<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="포트폴리오 - 홍진기"
    />
    <title>Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./portfolio.css" />
  </head>
  <body class="portfolio-body">
    <nav class="hero__quick-nav" aria-label="빠른 이동">
      <a href="#about" class="active">ABOUT</a>
      <a href="#experience">EXPERIENCE</a>
      <a href="#project">PROJECT</a>
      <a href="#skills">SKILLS</a>
      <a href="#deepdive">DEEP DIVE</a>
      <a href="#activity">ACTIVITY</a>
    </nav>

    <main>
      <section id="about" class="section print-page print-page--first reveal">
        <div class="about__top">
          <div class="about__intro">
            <h1 id="heroGreeting">안녕하세요.</h1>
          </div>

          <ul class="contact-list about__contacts" id="contactList"></ul>
        </div>

        <dl class="hero__philosophy" id="heroPhilosophy"></dl>
      </section>

      <section id="experience" class="section reveal">
        <h2>Experience</h2>
        <div class="project-list" id="experienceList"></div>
      </section>

      <section id="project" class="section reveal">
        <h2>Project</h2>
        <div class="project-list" id="projectList"></div>
      </section>

      <section id="skills" class="section print-page reveal">
        <h2>Skills</h2>
        <div class="skill-groups" id="skillGroups"></div>
      </section>

      <section id="deepdive" class="section print-page reveal">
        <h2>Deep Dive</h2>
        <div class="deepdive-list" id="deepDiveList"></div>
      </section>

      <section id="activity" class="section print-page reveal">
        <h2>Activity</h2>
        <div class="activity-group" id="openSourceGroup">
          <h3>오픈소스 기여</h3>
          <ul class="simple-list" id="openSourceList"></ul>
        </div>
        <div class="activity-group" id="etcActivityGroup">
          <h3>활동</h3>
          <ul class="simple-list" id="etcActivityList"></ul>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>© <span id="year"></span> <span id="footerName">홍진기</span> · Portfolio</p>
      <a href="#about">Back to top</a>
    </footer>

    <div class="floating-actions">
      <button id="printBtn" aria-label="포트폴리오 인쇄">
        <img src="./assets/icons/LightModeDownloadButton.svg" alt="다운로드 버튼 아이콘" />
      </button>
    </div>

    <script src="./portfolio.js"></script>
  </body>
</html>
